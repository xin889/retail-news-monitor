name: Refresh Retail Intelligence News

on:
  workflow_dispatch:
  schedule:
    - cron: "20 0 * * *"
    - cron: "20 10 * * *"

permissions:
  contents: write

jobs:
  refresh-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch and analyze news
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-v4-flash
        run: python scripts/fetch_news.py

      - name: Commit updated news data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet docs/news.json; then
            echo "No news.json changes to commit."
          else
            git add docs/news.json
            git commit -m "chore: refresh retail intelligence news"
            git push
          fi
