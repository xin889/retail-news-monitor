name: Refresh Retail Intelligence News

on:
  workflow_dispatch:
    inputs:
      reanalyze_existing:
        description: "Reanalyze existing news with DeepSeek or rule-based fallback"
        required: false
        default: "false"
      reset_news:
        description: "Clear existing news and fetch from scratch"
        required: false
        default: "false"
  schedule:
    - cron: "20 0 * * *"
    - cron: "20 10 * * *"

permissions:
  contents: write

jobs:
  refresh-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch and analyze news
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'deepseek' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'deepseek-v4-flash' }}
          LLM_ENDPOINT: ${{ vars.LLM_ENDPOINT }}
          LLM_TEMPERATURE: ${{ vars.LLM_TEMPERATURE || '0.2' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-v4-flash
          REANALYZE_EXISTING: ${{ github.event_name == 'workflow_dispatch' && inputs.reanalyze_existing || 'false' }}
          RESET_NEWS: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_news || 'false' }}
        run: python scripts/fetch_news.py

      - name: Commit refreshed news
        run: |
          if git diff --quiet docs/news.json; then
            echo "No news changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/news.json
            git commit -m "chore: refresh retail intelligence news"
            git push
          fi
