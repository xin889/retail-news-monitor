<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>外部动态监控雷达 —— 大商超事业群</title>
  <style>
    :root {
      --bg: #f8f6f5;
      --panel: #ffffff;
      --panel-soft: #fff4f2;
      --ink: #241514;
      --muted: #756865;
      --line: #eadbd8;
      --teal: #e1251b;
      --teal-soft: #fff1f0;
      --amber: #a16207;
      --amber-soft: #fff4d6;
      --red: #c8161d;
      --red-soft: #feeceb;
      --shadow: 0 8px 24px rgba(80, 20, 16, 0.08);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .shell {
      width: min(1440px, calc(100% - 32px));
      margin: 0 auto;
      padding: 22px 0 36px;
    }

    .top {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: start;
      padding: 22px 24px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(90deg, rgba(225, 37, 27, 0.12), rgba(255, 179, 71, 0.10)),
        var(--panel);
      box-shadow: var(--shadow);
    }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: fit-content;
      padding: 4px 9px;
      border: 1px solid rgba(225, 37, 27, 0.26);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      color: var(--teal);
      font-size: 12px;
      font-weight: 700;
    }

    .brand-title {
      margin: 9px 0 2px;
      font-size: 30px;
      line-height: 1.16;
      letter-spacing: 0;
    }

    .brand-subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .mode-card {
      min-width: 220px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.86);
    }

    .mode-label {
      color: var(--muted);
      font-size: 12px;
    }

    .mode-value {
      margin-top: 4px;
      font-size: 18px;
      font-weight: 800;
    }

    .source-note {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      margin: 12px 0;
    }

    .kpi {
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
    }

    .kpi .label {
      color: var(--muted);
      font-size: 12px;
    }

    .kpi .value {
      margin-top: 4px;
      font-size: 21px;
      font-weight: 800;
      white-space: nowrap;
    }

    .toolbar,
    .filters,
    .list-panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
      align-items: center;
      padding: 12px;
      margin-bottom: 12px;
    }

    .search {
      width: 100%;
      height: 38px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      color: var(--ink);
      outline: none;
    }

    .search:focus {
      border-color: rgba(225, 37, 27, 0.55);
      box-shadow: 0 0 0 3px rgba(225, 37, 27, 0.12);
    }

    select {
      height: 38px;
      padding: 0 34px 0 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      color: var(--ink);
    }

    .checkline {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 38px;
      color: var(--muted);
      white-space: nowrap;
    }

    .nav {
      display: flex;
      gap: 8px;
      margin: 12px 0;
    }

    .nav button,
    .chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
    }

    .nav button {
      padding: 10px 16px;
      font-weight: 800;
    }

    .chip {
      padding: 6px 10px;
      font-size: 13px;
    }

    .nav button.active,
    .chip.active {
      border-color: rgba(225, 37, 27, 0.42);
      background: var(--teal-soft);
      color: #b91c1c;
    }

    .filters {
      padding: 12px;
      margin-bottom: 12px;
    }

    .filter-row {
      display: grid;
      grid-template-columns: 92px 1fr;
      gap: 8px;
      align-items: start;
      padding: 6px 0;
    }

    .filter-label {
      padding-top: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .chip-group {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .list-panel {
      overflow: hidden;
    }

    .list-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 11px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-soft);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .news-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .news-row {
      position: relative;
      display: grid;
      grid-template-columns: 1fr;
      gap: 4px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    .news-row:last-child {
      border-bottom: 0;
    }

    .title-line {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
    }

    .news-title {
      min-width: 0;
      overflow: hidden;
      color: #14201a;
      font-size: 15px;
      font-weight: 760;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .news-title:hover {
      color: var(--teal);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .news-title.no-link {
      color: #5f6662;
      cursor: default;
    }

    .news-title.no-link:hover {
      color: #5f6662;
      text-decoration: none;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
    }

    .tag,
    .importance,
    .no-link-badge {
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      padding: 1px 7px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      white-space: nowrap;
    }

    .no-link-badge {
      background: #f5f5f4;
      color: #88817d;
    }

    .importance.high {
      border-color: rgba(180, 35, 24, 0.24);
      background: var(--red-soft);
      color: var(--red);
      font-weight: 800;
    }

    .importance.mid {
      border-color: rgba(161, 98, 7, 0.22);
      background: var(--amber-soft);
      color: var(--amber);
      font-weight: 800;
    }

    .insight-toggle {
      display: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--teal);
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      padding: 2px 8px;
      white-space: nowrap;
    }

    .tooltip {
      position: absolute;
      left: 14px;
      top: calc(100% - 6px);
      z-index: 5;
      display: none;
      width: min(620px, calc(100vw - 52px));
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      box-shadow: var(--shadow);
      color: var(--ink);
      font-size: 13px;
    }

    .news-row:hover .tooltip {
      display: block;
    }

    .tooltip strong {
      display: block;
      margin-bottom: 4px;
    }

    .tooltip p {
      margin: 0 0 8px;
    }

    .tooltip .fine {
      color: var(--muted);
      font-size: 12px;
    }

    .empty,
    .error {
      padding: 42px 16px;
      text-align: center;
      color: var(--muted);
    }

    .error {
      color: var(--red);
      background: var(--red-soft);
    }

    .nav {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .nav button {
      position: relative;
      min-height: 78px;
      border-radius: var(--radius);
      padding: 15px 18px;
      text-align: left;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(80, 20, 16, 0.06);
    }

    .nav button::after {
      content: attr(data-desc);
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .nav button[data-section="platform"] {
      --tab-color: #e1251b;
      --tab-soft: #fff1ee;
    }

    .nav button[data-section="retailer"] {
      --tab-color: #4f46e5;
      --tab-soft: #f1f0ff;
    }

    .nav button[data-section="category"] {
      --tab-color: #0f8f78;
      --tab-soft: #eafaf5;
    }

    .nav button.active {
      border-color: color-mix(in srgb, var(--tab-color) 42%, white);
      background: linear-gradient(135deg, var(--tab-soft), #fff);
      color: var(--tab-color);
      box-shadow: 0 10px 24px color-mix(in srgb, var(--tab-color) 16%, transparent);
    }

    .nav button.active::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 5px;
      background: var(--tab-color);
    }

    .jd-summary {
      margin-bottom: 12px;
      padding: 16px 18px;
      border: 1px solid rgba(225, 37, 27, 0.18);
      border-radius: var(--radius);
      background: linear-gradient(135deg, #fff7f5, #ffffff 58%, #fffaf0);
      box-shadow: var(--shadow);
    }

    .summary-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .summary-head h2 {
      margin: 0;
      font-size: 17px;
      letter-spacing: 0;
    }

    .summary-mode {
      color: var(--muted);
      font-size: 12px;
    }

    .summary-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .summary-item {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px;
      align-items: start;
      color: #35201f;
    }

    .judgment {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 42px;
      height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      color: var(--judge-color);
      background: var(--judge-bg);
    }

    .judge-opportunity { --judge-color: #057a55; --judge-bg: #dff8ec; }
    .judge-warning { --judge-color: #b54708; --judge-bg: #fff0d8; }
    .judge-action { --judge-color: #175cd3; --judge-bg: #e8f1ff; }
    .judge-watch { --judge-color: #5b4ab5; --judge-bg: #f0edff; }

    .chip {
      --chip-bg: #f6f4f3;
      --chip-color: #4b4643;
      --chip-border: #e5ddd9;
      --chip-active-bg: #e1251b;
      --chip-active-color: #fff;
      border-color: var(--chip-border);
      background: var(--chip-bg);
      color: var(--chip-color);
      font-weight: 720;
      box-shadow: 0 2px 8px rgba(70, 39, 34, 0.04);
    }

    .chip:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(70, 39, 34, 0.08);
    }

    .chip.active {
      border-color: var(--chip-active-bg);
      background: var(--chip-active-bg);
      color: var(--chip-active-color);
      box-shadow: 0 8px 18px color-mix(in srgb, var(--chip-active-bg) 20%, transparent);
    }

    .list-panel {
      border: 0;
      background: transparent;
      overflow: visible;
    }

    .list-head {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      margin-bottom: 10px;
    }

    .news-list {
      display: grid;
      gap: 12px;
    }

    .news-row {
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 5px 16px rgba(80, 20, 16, 0.05);
    }

    .news-row.high-priority {
      border-color: rgba(225, 37, 27, 0.28);
      box-shadow: 0 8px 22px rgba(225, 37, 27, 0.10);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .title-line {
      align-items: flex-start;
      justify-content: space-between;
    }

    .news-title {
      font-size: 18px;
      line-height: 1.35;
      color: #211817;
      white-space: normal;
    }

    .brief {
      display: -webkit-box;
      margin-top: 8px;
      overflow: hidden;
      color: #514946;
      font-size: 14px;
      line-height: 1.72;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 5;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 10px;
    }

    .source-link {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(225, 37, 27, 0.22);
      color: var(--teal);
      background: #fff8f7;
      font-size: 12px;
      font-weight: 800;
    }

    .source-link.disabled {
      border-color: var(--line);
      color: #8a8581;
      background: #f6f4f3;
      cursor: default;
    }

    .tooltip {
      width: min(700px, calc(100vw - 52px));
      padding: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
    }

    .insight-card {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      box-shadow: 0 16px 36px rgba(44, 31, 28, 0.16);
    }

    .insight-card h3 {
      margin: 0 0 10px;
      font-size: 15px;
    }

    .insight-section {
      padding-top: 10px;
      margin-top: 10px;
      border-top: 1px solid #f0e8e5;
    }

    .insight-label {
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .insight-core {
      margin: 0;
      color: #241514;
      font-size: 14px;
      line-height: 1.65;
      font-weight: 680;
    }

    .keyword-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .keyword-tag {
      padding: 2px 7px;
      border-radius: 999px;
      background: #f6f2f1;
      color: #665b57;
      font-size: 12px;
    }

    .word-cloud-panel {
      margin-top: 14px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .word-cloud-panel h2 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    .word-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 9px 12px;
      align-items: center;
      min-height: 58px;
    }

    .word-chip {
      border: 0;
      border-radius: 999px;
      padding: 4px 10px;
      background: linear-gradient(135deg, #fff1f0, #fff);
      color: #7f1d1d;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      box-shadow: 0 3px 10px rgba(80, 20, 16, 0.06);
    }

    .word-chip:hover {
      transform: translateY(-1px);
      color: #e1251b;
    }

    @media (max-width: 920px) {
      .top,
      .toolbar {
        grid-template-columns: 1fr;
      }

      .mode-card {
        min-width: 0;
      }

      .kpis {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .filter-row {
        grid-template-columns: 1fr;
      }

      .filter-label {
        padding-top: 0;
      }
    }

    @media (max-width: 640px) {
      .shell {
        width: min(100% - 20px, 1440px);
        padding-top: 12px;
      }

      .top {
        padding: 18px;
      }

      .brand-title {
        font-size: 24px;
      }

      .kpis {
        grid-template-columns: 1fr;
      }

      .nav {
        overflow-x: auto;
        padding-bottom: 2px;
      }

      .nav button {
        flex: 0 0 auto;
      }

      .title-line {
        align-items: flex-start;
      }

      .news-title {
        white-space: normal;
      }

      .insight-toggle {
        display: inline-flex;
      }

      .news-row:hover .tooltip {
        display: none;
      }

      .news-row.expanded .tooltip {
        position: static;
        display: block;
        width: 100%;
        margin-top: 6px;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div>
        <div class="brand-mark">商分商超小诸葛 出品</div>
        <h1 class="brand-title">外部动态监控雷达 —— 大商超事业群</h1>
        <p class="brand-subtitle">平台竞对 × 零售商竞对 × 品类品牌动态</p>
      </div>
      <aside class="mode-card">
        <div class="mode-label">当前 AI 模式</div>
        <div class="mode-value" id="aiMode">规则版解读</div>
        <div class="source-note" id="sourceNote">数据来源：RSS / Google News RSS / 官方公开页面 / 规则版解读</div>
      </aside>
    </header>

    <section class="kpis" aria-label="KPI">
      <div class="kpi"><div class="label">今日新增</div><div class="value" id="todayCount">0</div></div>
      <div class="kpi"><div class="label">近 7 日新闻</div><div class="value" id="last7Count">0</div></div>
      <div class="kpi"><div class="label">总新闻数</div><div class="value" id="totalCount">0</div></div>
      <div class="kpi"><div class="label">最新刷新时间</div><div class="value" id="updatedAt">-</div></div>
      <div class="kpi"><div class="label">当前筛选结果</div><div class="value" id="filteredCount">0</div></div>
    </section>

    <section class="toolbar" aria-label="全局工具">
      <input class="search" id="searchInput" type="search" placeholder="搜索标题、摘要、来源、主体、标签、AI 解读">
      <select id="sortSelect" aria-label="排序">
        <option value="time">按发布时间倒序</option>
        <option value="importance">按重要性排序</option>
      </select>
      <label class="checkline">
        <input id="highOnly" type="checkbox">
        只看重要性 ≥ 4
      </label>
    </section>

    <nav class="nav" aria-label="主导航">
      <button class="active" data-section="platform" data-desc="平台策略、政策、即时零售与商家生态">平台竞对</button>
      <button data-section="retailer" data-desc="会员店、商超、硬折扣与前置仓动态">零售商</button>
      <button data-section="category" data-desc="政策监管、新品趋势与重点品牌动作">品类洞察</button>
    </nav>

    <section class="jd-summary" id="jdSummary" aria-label="京东视角关键判断"></section>

    <section class="filters" id="filters" aria-label="筛选条件"></section>

    <section class="list-panel">
      <div class="list-head">
        <span id="listTitle">平台竞对新闻</span>
        <span id="listHint">标题悬停查看解读</span>
      </div>
      <div id="status"></div>
      <ul class="news-list" id="newsList"></ul>
    </section>

    <section class="word-cloud-panel" aria-label="当前页面热点词云">
      <h2>当前页面热点词云</h2>
      <div class="word-cloud" id="wordCloud"></div>
    </section>
  </main>

  <script>
    const FILTERS = {
      platform: {
        title: "平台竞对新闻",
        rows: [
          { key: "entity", label: "平台", values: ["全部", "淘宝天猫", "抖音电商", "拼多多", "美团"] },
          { key: "dimension", label: "维度", values: ["全部", "业务表现", "组织架构", "平台政策", "组织策略", "商家生态", "即时零售", "用户增长", "科技 / AI", "其他"] }
        ]
      },
      retailer: {
        title: "零售商新闻",
        rows: [

    function escapeHTML(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function compact(value) {
      return String(value ?? "").replace(/\s+/g, "").toLowerCase();
    }

    function formatDate(value, withTime = false) {
      if (!value) return "-";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      const options = withTime
        ? { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false }
        : { year: "numeric", month: "2-digit", day: "2-digit" };
      return new Intl.DateTimeFormat("zh-CN", options).format(date);
    }

    function hasValidLink(value) {
      return /^https?:\/\//i.test(String(value || "").trim());
    }

      const palette = CHIP_COLORS[value] || DIMENSION_COLORS[index % DIMENSION_COLORS.length];
      return `--chip-bg:${palette[0]};--chip-color:${palette[1]};--chip-border:${palette[2]};--chip-active-bg:${palette[3]};--chip-active-color:${palette[4]};`;

    function judgmentClass(type) {
      if (type === "机会") return "judge-opportunity";

    function judgmentTypeOf(item) {
      const category = item.category || "";
      const importance = Number(item.importance || 1);
      if (importance >= 5 || ["食品安全", "行业政策", "监管合规", "平台政策"].includes(category)) return "预警";
      if (["新品发布", "行业热点 / 新品趋势", "自有品牌", "爆品", "会员 / 用户"].includes(category)) return "机会";
      if (["开店 / 拓店", "即时零售", "供应链能力", "渠道动作", "营销活动"].includes(category)) return "动作";
      return "关注";

    function firstSentences(text, limit = 2) {
      const parts = String(text || "").split(/[。！？!?]\s*/).map(x => x.trim()).filter(Boolean);
      return parts.slice(0, limit).join("。") + (parts.length ? "。" : "");
    }

    function categoryGroupOf(item) {
      if (item.category_group) return item.category_group;
      if (item.entity && CATEGORY_BRANDS[item.entity]) return item.entity;
      const text = `${item.entity || ""} ${item.display_title || ""} ${item.title || ""} ${(item.matched_keywords || []).join(" ")}`;
      for (const [group, brands] of Object.entries(CATEGORY_BRANDS)) {
        if (compact(text).includes(compact(group))) return group;
        if (brands.some(brand => compact(text).includes(compact(brand)))) return group;
      }
      return item.entity_type === "category" ? item.entity : "";
    }

    function dimensionMatches(item, filterValue) {
      if (filterValue === "全部") return true;
      const category = item.category || "";
      const subcategory = item.subcategory || "";
      const haystack = compact(`${category} ${subcategory} ${(item.matched_keywords || []).join(" ")} ${item.ai_insight || ""}`);
      const value = compact(filterValue);
      const aliases = {
        "业务表现": ["业务规模", "GMV", "财报业绩"],
        "组织策略": ["组织架构", "组织调整", "集团策略", "经营机制"],
        "爆品与上新": ["爆品", "新品发布", "上新", "行业热点 / 新品趋势"],
        "供应链": ["供应链能力", "履约", "前置仓"],
        "营收利润/财报": ["财报业绩", "营收利润", "业务规模", "GMV"],
        "营销动作": ["营销活动", "渠道动作"],
        "策略": ["集团策略", "经营机制", "价格力策略", "平台政策"]
      };
      if (haystack.includes(value)) return true;
      return (aliases[filterValue] || []).some(alias => haystack.includes(compact(alias)));
    }

    function entityMatches(item) {
      if (state.entity === "全部") return true;
      if (state.section === "category") {
        const group = categoryGroupOf(item) || item.entity || "";
        return compact(group).includes(compact(state.entity));
      }
      const haystack = compact(`${item.entity || ""} ${item.display_title || ""} ${item.title || ""} ${(item.matched_keywords || []).join(" ")}`);
      return haystack.includes(compact(state.entity));
    }

    function subcategoryMatches(item) {
      if (state.subcategory === "全部") return true;
      const subcategory = item.subcategory || "";
      const category = item.category || "";
      if (state.subcategory === "行业政策") {
        return subcategory === "行业政策" || category === "行业政策";
      }
      if (state.subcategory === "行业热点 / 新品趋势") {
        return subcategory === "行业热点 / 新品趋势" || category === "行业热点 / 新品趋势" || category === "新品发布";
      }
      if (state.subcategory === "重点品牌动态") {
        return subcategory === "重点品牌动态" || item.entity_type === "brand";
      }
      return false;
    }

    function searchMatches(item) {
      if (!state.search) return true;
      const text = [
        item.title,
        item.display_title,
        item.summary,
        item.source,
        item.entity,
        item.category_group,
        item.category,
        item.subcategory,
        item.ai_insight,
        item.brief_body,
        item.reason,
        ...(item.matched_keywords || [])
      ].join(" ");
      return compact(text).includes(compact(state.search));
    }

    function sectionItems() {
      return (newsData.items || []).filter(item => itemSectionOf(item) === state.section);
    }

    function filteredItems() {
      let items = (newsData.items || []).filter(item => {
        if (itemSectionOf(item) !== state.section) return false;
        if (!entityMatches(item)) return false;
        if (state.section === "category" && !subcategoryMatches(item)) return false;
        if (state.section !== "category" && !dimensionMatches(item, state.dimension)) return false;
        if (state.highOnly && Number(item.importance || 0) < 4) return false;
        return searchMatches(item);
      });

      items.sort((a, b) => {
        if (state.sort === "importance") {
          const score = Number(b.importance || 0) - Number(a.importance || 0);
          if (score !== 0) return score;
        }
        return new Date(b.published || 0) - new Date(a.published || 0);
      });
      return items;
    }

    const WORD_STOP = new Set("新闻 动态 平台 品牌 公司 相关 关注 影响 表示 发布 市场 进行 以及 通过 当前 可以 建议 业务 用户 行业 方面 京东 商超 一个 可能 需要 持续 外部 经营 情报 视角".split(" "));

    function addWord(counter, word, weight = 1) {
      word = String(word || "").trim();
      if (!word || word.length < 2 || WORD_STOP.has(word)) return;
      if (/^\d+$/.test(word)) return;
      counter.set(word, (counter.get(word) || 0) + weight);
    }

    function extractWordsFromText(text, counter) {
      const clean = String(text || "").replace(/[^\u4e00-\u9fffA-Za-z0-9/ ]+/g, " ");
      const cjkChunks = clean.match(/[\u4e00-\u9fff]{2,8}/g) || [];
      cjkChunks.forEach(chunk => {
        if (chunk.length <= 4) {
          addWord(counter, chunk);
        } else {
          for (let i = 0; i <= chunk.length - 2; i += 2) addWord(counter, chunk.slice(i, i + 4));
        }
      });
      const enWords = clean.match(/[A-Za-z][A-Za-z0-9-]{2,}/g) || [];
      enWords.forEach(word => addWord(counter, word.toLowerCase()));
    }

    function renderWordCloud(items) {
      if (!items.length) {
        els.wordCloud.innerHTML = `<div class="empty" style="padding:18px 0;">当前筛选结果为空，暂无热点词云</div>`;
        return;
      }
      const counter = new Map();
      items.forEach(item => {
        (item.matched_keywords || []).forEach(word => addWord(counter, word, 4));
        [item.display_title, item.category, item.entity, item.category_group, item.ai_insight, item.brief_body].forEach(text => extractWordsFromText(text, counter));
      });
      const words = [...counter.entries()]
        .sort((a, b) => b[1] - a[1])
        .slice(0, 40);
      if (!words.length) {
        els.wordCloud.innerHTML = `<div class="empty" style="padding:18px 0;">暂无可展示热词</div>`;
        return;
      }
      const max = Math.max(...words.map(([, count]) => count));
      const min = Math.min(...words.map(([, count]) => count));
      els.wordCloud.innerHTML = words.map(([word, count]) => {
        const ratio = max === min ? 0.5 : (count - min) / (max - min);
        const size = 12 + Math.round(ratio * 14);
        return `<button class="word-chip" style="font-size:${size}px" data-word="${escapeHTML(word)}">${escapeHTML(word)}</button>`;
      }).join("");
    }

    function importanceClass(score) {
      if (Number(score) >= 4) return "high";
      if (Number(score) === 3) return "mid";
      return "";
    }

    function renderList() {
      const items = filteredItems();
      els.filteredCount.textContent = items.length;
      els.newsList.innerHTML = "";
      els.status.innerHTML = "";

      if (!items.length) {
        const categoryTotal = (newsData.items || []).filter(item => itemSectionOf(item) === "category").length;
        const diagnostic = state.section === "category"
          ? `<div style="margin-top:8px;font-size:12px;">当前 news.json 中 category 新闻数：${categoryTotal}；当前筛选后数量：0</div>`
          : "";
        els.status.innerHTML = `<div class="empty">暂无匹配新闻，可调整筛选条件或等待下次刷新${diagnostic}</div>`;
        renderWordCloud(items);
        return;
      }

      els.newsList.innerHTML = items.map(item => {
        const keywords = (item.matched_keywords || []).join("、") || "-";
        const keywordTags = (item.matched_keywords || []).slice(0, 10).map(word => `<span class="keyword-tag">${escapeHTML(word)}</span>`).join("") || `<span class="keyword-tag">暂无关键词</span>`;
        const source = item.source || "未知来源";
        const date = formatDate(item.published);
        const category = item.subcategory || item.category || "其他";
        const importance = Number(item.importance || 1);
        const link = String(item.link || "").trim();
        const displayTitle = itemDisplayTitle(item);
        const originalTitle = item.title || displayTitle;
        const brief = bodyTextOf(item);
        const judge = judgmentTypeOf(item);
        const titleNode = hasValidLink(link)
          ? `<a class="news-title" href="${escapeHTML(link)}" target="_blank" rel="noopener noreferrer">${escapeHTML(displayTitle)}</a>`
          : `<span class="news-title no-link">${escapeHTML(displayTitle)}</span>`;
        const sourceNode = hasValidLink(link)
          ? `<a class="source-link" href="${escapeHTML(link)}" target="_blank" rel="noopener noreferrer">查看原文</a>`
          : `<span class="source-link disabled">无原文链接</span>`;
        return `
          <li class="news-row ${importance >= 4 ? "high-priority" : ""}">
            <div class="card-top">
              <div class="card-tags">
                <span class="tag">${escapeHTML(item.entity || categoryGroupOf(item) || "-")}</span>
                <span class="tag">${escapeHTML(category)}</span>
                <span class="importance ${importanceClass(importance)}">重要性 ${importance}</span>
                ${item.analysis_mode === "deepseek" ? `<span class="tag">AI解读</span>` : ""}
              </div>
              <span class="judgment ${judgmentClass(judge)}">${escapeHTML(judge)}</span>
            </div>
            <div class="title-line">
              ${titleNode}
              <button class="insight-toggle" type="button">解读</button>
            </div>
            <div class="brief">${escapeHTML(brief)}</div>
            <div class="meta">
              <span>${escapeHTML(date)}</span>
              <span>${escapeHTML(source)}</span>
              <span>主体：${escapeHTML(item.entity || categoryGroupOf(item) || "-")}</span>
            </div>
            <div class="card-footer">${sourceNode}</div>
            <div class="tooltip">
              <div class="insight-card">
                <h3>AI 解读</h3>
                <div><span class="judgment ${judgmentClass(judge)}">${escapeHTML(judge)}</span></div>
                <div class="insight-section">
                  <div class="insight-label">核心判断</div>
                  <p class="insight-core">${escapeHTML(item.ai_insight || "暂无解读")}</p>
                </div>
                <div class="insight-section">
                  <div class="insight-label">京东关注点</div>
                  <p>${escapeHTML(jdFocusOf(item))}</p>
                </div>
                <div class="insight-section">
                  <div class="insight-label">命中关键词</div>
                  <div class="keyword-tags">${keywordTags}</div>
                </div>
                <div class="insight-section fine">
                  <p>原始标题：${escapeHTML(originalTitle)}</p>
                  <p>来源：${escapeHTML(source)} / 发布时间：${escapeHTML(formatDate(item.published, true))}</p>
                  <p>判断依据：${escapeHTML(item.reason || "-")}</p>
                </div>
              </div>
            </div>
          </li>
        `;
      }).join("");
      renderWordCloud(items);
    }

    function render() {
      updateStaticKpis();
      renderFilters();
      renderJdSummary(sectionItems());
      renderList();
      document.querySelectorAll(".nav button").forEach(button => {
        button.classList.toggle("active", button.dataset.section === state.section);
      });
    }

    document.querySelector(".nav").addEventListener("click", event => {
      const button = event.target.closest("button[data-section]");
      if (!button) return;
      state.section = button.dataset.section;
      state.entity = "全部";
      state.dimension = "全部";
      state.subcategory = "全部";
      render();
    });

    els.filters.addEventListener("click", event => {
      const button = event.target.closest("button[data-filter-key]");
      if (!button) return;
      state[button.dataset.filterKey] = button.dataset.filterValue;
      render();
    });

    els.searchInput.addEventListener("input", event => {
      state.search = event.target.value.trim();
      renderList();
    });

    els.sortSelect.addEventListener("change", event => {
      state.sort = event.target.value;
      renderList();
    });

    els.highOnly.addEventListener("change", event => {
      state.highOnly = event.target.checked;
      renderList();
    });

    els.newsList.addEventListener("click", event => {
      const button = event.target.closest(".insight-toggle");
      if (!button) return;
      const row = button.closest(".news-row");
      row.classList.toggle("expanded");
    });

    els.wordCloud.addEventListener("click", event => {
      const button = event.target.closest(".word-chip");
      if (!button) return;
      const word = button.dataset.word || "";
      state.search = word;
      els.searchInput.value = word;
      renderList();
    });

    async function loadNews() {
      try {
        const response = await fetch("./news.json", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        newsData = await response.json();
        if (!Array.isArray(newsData.items)) newsData.items = [];
        render();
      } catch (error) {
        els.status.innerHTML = `<div class="error">news.json 加载失败：${escapeHTML(error.message)}。请确认 docs/news.json 存在，或通过本地静态服务 / GitHub Pages 打开页面。</div>`;
      }
    }

    loadNews();
  </script>
</body>
</html>
